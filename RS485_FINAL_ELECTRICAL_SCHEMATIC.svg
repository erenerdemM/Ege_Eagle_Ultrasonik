<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Definitions for markers and styling -->
  <defs>
    <linearGradient id="stmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="modBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="espBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Title Header -->
  <rect x="20" y="20" width="960" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="500" y="52" text-anchor="middle" fill="#38bdf8" font-size="20" font-weight="bold">EAGLEULTRASONİK — RS485 HARDWARE ELECTRICAL SCHEMATIC (MAX485ESA 5V)</text>

  <!-- STM32 NODE BLOCK -->
  <rect x="30" y="100" width="220" height="380" rx="10" fill="url(#stmBg)" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="130" text-anchor="middle" fill="#60a5fa" font-size="16" font-weight="bold">STM32G474RE NODE</text>
  <text x="140" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">Nucleo Board (3.3V Logic)</text>

  <rect x="45" y="180" width="190" height="35" rx="5" fill="#334155"/>
  <text x="55" y="202" fill="#f8fafc" font-size="13" font-weight="bold">PB10 (USART3_TX)</text>

  <rect x="45" y="235" width="190" height="35" rx="5" fill="#334155"/>
  <text x="55" y="257" fill="#f8fafc" font-size="13" font-weight="bold">PB11 (USART3_RX - 5V FT)</text>

  <rect x="45" y="290" width="190" height="35" rx="5" fill="#334155"/>
  <text x="55" y="312" fill="#f8fafc" font-size="13" font-weight="bold">PB1 (RS485_DE_RE)</text>

  <rect x="45" y="365" width="190" height="30" rx="5" fill="#1e293b" stroke="#ef4444"/>
  <text x="55" y="385" fill="#fca5a5" font-size="12">Nucleo 5V Rail</text>

  <rect x="45" y="410" width="190" height="30" rx="5" fill="#1e293b" stroke="#64748b"/>
  <text x="55" y="430" fill="#cbd5e1" font-size="12">Common GND Bus</text>

  <!-- MAX485 #1 MODULE BLOCK -->
  <rect x="300" y="140" width="160" height="300" rx="10" fill="url(#modBg)" stroke="#818cf8" stroke-width="2"/>
  <text x="380" y="170" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="bold">MAX485 #1</text>
  <text x="380" y="188" text-anchor="middle" fill="#a78bfa" font-size="11">STM32 Side Transceiver</text>

  <text x="315" y="202" fill="#e2e8f0" font-size="13">DI (Pin 4)</text>
  <text x="315" y="257" fill="#e2e8f0" font-size="13">RO (Pin 1)</text>
  <text x="315" y="312" fill="#e2e8f0" font-size="13">DE / /RE (2,3)</text>
  <text x="315" y="385" fill="#ef4444" font-size="12">VCC (Pin 8)</text>
  <text x="315" y="430" fill="#94a3b8" font-size="12">GND (Pin 5)</text>

  <text x="445" y="280" text-anchor="end" fill="#38bdf8" font-size="14" font-weight="bold">A (Pin 6)</text>
  <text x="445" y="340" text-anchor="end" fill="#f43f5e" font-size="14" font-weight="bold">B (Pin 7)</text>

  <!-- MAX485 #2 MODULE BLOCK -->
  <rect x="540" y="140" width="160" height="300" rx="10" fill="url(#modBg)" stroke="#818cf8" stroke-width="2"/>
  <text x="620" y="170" text-anchor="middle" fill="#c084fc" font-size="15" font-weight="bold">MAX485 #2</text>
  <text x="620" y="188" text-anchor="middle" fill="#a78bfa" font-size="11">ESP32 Side Transceiver</text>

  <text x="555" y="280" fill="#38bdf8" font-size="14" font-weight="bold">A (Pin 6)</text>
  <text x="555" y="340" fill="#f43f5e" font-size="14" font-weight="bold">B (Pin 7)</text>

  <text x="685" y="202" text-anchor="end" fill="#e2e8f0" font-size="13">DI (Pin 4)</text>
  <text x="685" y="257" text-anchor="end" fill="#e2e8f0" font-size="13">RO (Pin 1)</text>
  <text x="685" y="312" text-anchor="end" fill="#e2e8f0" font-size="13">DE / /RE (2,3)</text>
  <text x="685" y="385" text-anchor="end" fill="#ef4444" font-size="12">VCC (Pin 8)</text>
  <text x="685" y="430" text-anchor="end" fill="#94a3b8" font-size="12">GND (Pin 5)</text>

  <!-- ESP32-S3 NODE BLOCK -->
  <rect x="750" y="100" width="220" height="380" rx="10" fill="url(#espBg)" stroke="#10b981" stroke-width="2"/>
  <text x="860" y="130" text-anchor="middle" fill="#34d399" font-size="16" font-weight="bold">ESP32-S3 NODE</text>
  <text x="860" y="150" text-anchor="middle" fill="#94a3b8" font-size="12">N16R8 Master (3.3V Logic)</text>

  <rect x="765" y="180" width="190" height="35" rx="5" fill="#334155"/>
  <text x="945" y="202" text-anchor="end" fill="#f8fafc" font-size="13" font-weight="bold">GPIO8 (UART1_TX)</text>

  <rect x="765" y="235" width="190" height="35" rx="5" fill="#334155"/>
  <text x="945" y="257" text-anchor="end" fill="#f8fafc" font-size="13" font-weight="bold">GPIO18 (RX1 - 3.3V Max)</text>

  <rect x="765" y="290" width="190" height="35" rx="5" fill="#334155"/>
  <text x="945" y="312" text-anchor="end" fill="#f8fafc" font-size="13" font-weight="bold">GPIO5 (RS485_DE)</text>

  <rect x="765" y="365" width="190" height="30" rx="5" fill="#1e293b" stroke="#ef4444"/>
  <text x="945" y="385" text-anchor="end" fill="#fca5a5" font-size="12">ESP32 5V Rail</text>

  <rect x="765" y="410" width="190" height="30" rx="5" fill="#1e293b" stroke="#64748b"/>
  <text x="945" y="430" text-anchor="end" fill="#cbd5e1" font-size="12">Common GND Bus</text>

  <!-- WIRING CONNECTIONS -->

  <!-- STM32 to MAX485 #1 -->
  <line x1="235" y1="197" x2="300" y2="197" stroke="#38bdf8" stroke-width="2"/>
  <line x1="235" y1="252" x2="300" y2="252" stroke="#34d399" stroke-width="2"/>
  <line x1="235" y1="307" x2="300" y2="307" stroke="#a78bfa" stroke-width="2"/>

  <!-- DIFFERENTIAL RS485 BUS -->
  <line x1="440" y1="275" x2="560" y2="275" stroke="#38bdf8" stroke-width="3"/>
  <line x1="440" y1="335" x2="560" y2="335" stroke="#f43f5e" stroke-width="3"/>
  <text x="500" y="265" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">LINE A (+)</text>
  <text x="500" y="355" text-anchor="middle" fill="#f43f5e" font-size="12" font-weight="bold">LINE B (-)</text>

  <!-- Termination Resistor #1 -->
  <rect x="445" y="290" width="10" height="30" fill="#e2e8f0" stroke="#000"/>
  <line x1="450" y1="275" x2="450" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="450" y2="335" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="435" y="310" text-anchor="end" fill="#fbbf24" font-size="10" font-weight="bold">120Ω</text>

  <!-- Termination Resistor #2 -->
  <rect x="545" y="290" width="10" height="30" fill="#e2e8f0" stroke="#000"/>
  <line x1="550" y1="275" x2="550" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="550" y1="320" x2="550" y2="335" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="565" y="310" fill="#fbbf24" font-size="10" font-weight="bold">120Ω</text>

  <!-- MAX485 #2 to ESP32-S3 -->
  <line x1="700" y1="197" x2="765" y2="197" stroke="#38bdf8" stroke-width="2"/>
  <line x1="700" y1="307" x2="765" y2="307" stroke="#a78bfa" stroke-width="2"/>

  <!-- VOLTAGE DIVIDER CIRCUIT ON ESP32 RX (GPIO18) -->
  <line x1="700" y1="252" x2="720" y2="252" stroke="#f59e0b" stroke-width="2"/>
  <rect x="720" y="247" width="20" height="10" fill="#fbbf24"/>
  <text x="730" y="242" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">10kΩ</text>

  <line x1="740" y1="252" x2="765" y2="252" stroke="#34d399" stroke-width="2"/>
  <circle cx="745" cy="252" r="3" fill="#34d399"/>

  <line x1="745" y1="252" x2="745" y2="270" stroke="#f59e0b" stroke-width="2"/>
  <rect x="740" y="270" width="10" height="20" fill="#fbbf24"/>
  <text x="755" y="283" fill="#fbbf24" font-size="10" font-weight="bold">18kΩ</text>

  <line x1="745" y1="290" x2="745" y2="425" stroke="#94a3b8" stroke-width="2"/>
  <line x1="745" y1="425" x2="765" y2="425" stroke="#94a3b8" stroke-width="2"/>

  <!-- VOLTAGE ANNOTATION -->
  <rect x="710" y="212" width="70" height="20" rx="4" fill="#065f46" stroke="#10b981"/>
  <text x="745" y="226" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">Vout = 3.21V</text>

  <!-- COMMON GND BUS -->
  <rect x="30" y="520" width="940" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="500" y="545" text-anchor="middle" fill="#cbd5e1" font-size="14" font-weight="bold">COMMON LOGIC SIGNAL GROUND BUS (0V REFERENCE)</text>

  <line x1="140" y1="440" x2="140" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="380" y1="440" x2="380" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="620" y1="440" x2="620" y2="520" stroke="#64748b" stroke-width="2"/>
  <line x1="860" y1="440" x2="860" y2="520" stroke="#64748b" stroke-width="2"/>

  <!-- FOOTER -->
  <text x="500" y="600" text-anchor="middle" fill="#64748b" font-size="12">Phase 5.2 Authoritative Hardware Wiring Package | EAGLEULTRASONİK Project</text>
</svg>
